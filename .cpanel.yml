---
deployment:
  tasks:
    # 1. Define deployment target path
    - export DEPLOYPATH=/home/panaroma/shitalakshyafoundation.com

    # 2. Ensure target directory exists
    - mkdir -p $DEPLOYPATH

    # 3. Sync all project files (preserves live .env and user uploads)
    - /usr/bin/rsync -av --exclude='.git' --exclude='.env' --exclude='storage/app/public' . $DEPLOYPATH

    # 4. Create storage symlink & set correct permissions
    - cd $DEPLOYPATH && php artisan storage:link || true
    - cd $DEPLOYPATH && chmod -R 775 storage bootstrap/cache || true

    # 5. Clear and rebuild Laravel production cache
    - cd $DEPLOYPATH && php artisan optimize:clear || true
    - cd $DEPLOYPATH && php artisan config:cache || true
    - cd $DEPLOYPATH && php artisan route:cache || true
    - cd $DEPLOYPATH && php artisan view:cache || true

    # 6. Run database migrations safely
    - cd $DEPLOYPATH && php artisan migrate --force || true

