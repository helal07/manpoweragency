---
deployment:
  tasks:
    # 1. Set DEPLOYPATH to the root directory of your subdomain.
    # IMPORTANT: Replace "YOUR_CPANEL_USERNAME" with your actual cPanel username.
    - export DEPLOYPATH=/home/YOUR_CPANEL_USERNAME/shitalakshyafoundation.com
    
    # 2. Copy all files from the git repository to the deployment directory
    # Using -a to ensure hidden files like .htaccess are also copied
    - /bin/cp -a . $DEPLOYPATH
    
    # 3. Run Composer to install dependencies
    # (assuming composer is available globally as 'composer')
    - cd $DEPLOYPATH && composer install --no-dev --optimize-autoloader
    
    # 4. Clear and cache config/routes/views for performance
    - cd $DEPLOYPATH && php artisan optimize:clear
    - cd $DEPLOYPATH && php artisan config:cache
    - cd $DEPLOYPATH && php artisan route:cache
    - cd $DEPLOYPATH && php artisan view:cache
    
    # 5. Run database migrations (make sure your .env is set up on the server!)
    - cd $DEPLOYPATH && php artisan migrate --force
