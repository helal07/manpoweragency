---
deployment:
  tasks:
    # 1. Define deployment target path
    - export DEPLOYPATH=/home/panaroma/shitalakshyafoundation.com

    # 2. Ensure target directory exists
    - mkdir -p $DEPLOYPATH

    # 3. Sync all project files (including .htaccess, excluding .git)
    - /usr/bin/rsync -av --exclude='.git' . $DEPLOYPATH

    # 4. Install Composer dependencies
    - cd $DEPLOYPATH && composer install --no-dev --optimize-autoloader

    # 5. Create storage symlink & set correct permissions
    - cd $DEPLOYPATH && php artisan storage:link || true
    - cd $DEPLOYPATH && chmod -R 775 storage bootstrap/cache || true

    # 6. Clear and rebuild Laravel production cache
    - cd $DEPLOYPATH && php artisan optimize:clear
    - cd $DEPLOYPATH && php artisan config:cache
    - cd $DEPLOYPATH && php artisan route:cache
    - cd $DEPLOYPATH && php artisan view:cache

    # 7. Run database migrations safely
    - cd $DEPLOYPATH && php artisan migrate --force
